<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>styayur — site moved</title>
<script>
(() => {
  const target = new URL('https://styayur.co.uk/');
  target.pathname = window.location.pathname === '/index.html' ? '/' : window.location.pathname;
  target.search = window.location.search;
  target.hash = window.location.hash;
  window.location.replace(target.href);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://styayur.co.uk/" /></noscript>
<link rel="canonical" href="https://styayur.co.uk/" />
</head>
<body style="font:16px/1.6 system-ui,sans-serif;max-width:42rem;margin:4rem auto;padding:0 1.5rem;color:#222;">

</body>
</html>
