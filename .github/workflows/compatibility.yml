name: Compatibility entrypoint
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          assert.match(html, /http-equiv="refresh" content="0; url=https:\/\/styayur\.co\.uk\/"/);
          assert.match(html, /rel="canonical" href="https:\/\/styayur\.co\.uk\/"/);
          assert.match(html, /<h1>Stya Yur<\/h1>/);
          assert.match(html, /<a href="https:\/\/styayur\.co\.uk\/">/);
          assert.equal(fs.existsSync('.nojekyll'), true);
          JS
